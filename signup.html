<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AROKIYAM - Sign Up</title>
<meta name="theme-color" content="#0b3fa8">
<link rel="icon" type="image/png" href="assets/app-icon.png">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="signup">
<main class="auth">
  <header class="auth-top">
    <i class="note n1">♪</i><i class="note n2">♫</i>
    <img src="assets/arokiyam_mark.svg" alt="" class="mark">
    <h1>AROKIYAM</h1><p>Tamil Christian Music</p>
  </header>
  <section class="sheet">
    <h2>Create Account</h2><p class="sub">Join our music community</p>
    <form id="signupForm" novalidate>
      <div class="field"><label for="name" class="sr">Full Name</label><div class="box"><svg class="ic" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg><input id="name" name="name" type="text" placeholder="Full Name" autocomplete="name"></div><small class="err"></small></div>
      <div class="field"><label for="email" class="sr">Email Address</label><div class="box"><svg class="ic" viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v.5l7 5 7-5V7zm14 3L12 15 5 10v7h14z"/></svg><input id="email" name="email" type="email" placeholder="Email Address" autocomplete="email"></div><small class="err"></small></div>
      <div class="field"><label for="password" class="sr">Password</label><div class="box"><svg class="ic" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 1 1 12 0v2h1v11H5V10zm2 0h8V8a4 4 0 1 0-8 0z"/></svg><input id="password" name="password" type="password" placeholder="Password" autocomplete="new-password"><button type="button" class="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button></div><small class="err"></small></div>
      <div class="field"><label for="confirm" class="sr">Confirm Password</label><div class="box"><svg class="ic" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 1 1 12 0v2h1v11H5V10zm2 0h8V8a4 4 0 1 0-8 0z"/></svg><input id="confirm" name="confirm" type="password" placeholder="Confirm Password" autocomplete="new-password"><button type="button" class="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button></div><small class="err"></small></div>
      <button class="primary" id="submitBtn" type="submit">Create Account</button>
    </form>
    <div class="or"><span>or</span></div>
    <button type="button" class="social" data-soon="Google"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.9-5.5 3.9a6.1 6.1 0 1 1 0-12.2c1.9 0 3.2.8 3.9 1.5l2.7-2.6A9.9 9.9 0 0 0 12 2a10 10 0 1 0 0 20c5.8 0 9.6-4 9.6-9.8 0-.7-.1-1.2-.2-2z"/></svg>Continue with Google</button>

    <p class="switch">Already have an account? <a href="login.html">Login</a></p>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/auth.js"></script>
<script src="js/auth-pages.js"></script>
</body>
</html>
