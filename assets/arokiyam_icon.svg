<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="arokiyamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d26a"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <rect width="512" height="512" rx="128" fill="#0b1319"/>
  <circle cx="256" cy="256" r="236" fill="url(#arokiyamGrad)"/>
  <circle cx="256" cy="256" r="226" fill="#0b171f"/>

  <!-- Radiant Sound Waves / Rays of Healing -->
  <g stroke="url(#arokiyamGrad)" stroke-linecap="round" opacity="0.85">
    <!-- Outer wave arcs -->
    <path d="M 120 200 A 170 170 0 0 1 392 200" fill="none" stroke-width="14"/>
    <path d="M 155 230 A 125 125 0 0 1 357 230" fill="none" stroke-width="12"/>
    <path d="M 190 260 A 80 80 0 0 1 322 260" fill="none" stroke-width="10"/>
  </g>

  <!-- Sacred Healing Cross / Sound Anchor in Center -->
  <g filter="url(#glow)">
    <!-- Vertical beam -->
    <rect x="244" y="160" width="24" height="230" rx="12" fill="url(#goldAccent)"/>
    <!-- Horizontal beam -->
    <rect x="180" y="210" width="152" height="24" rx="12" fill="url(#goldAccent)"/>
    <!-- Central Jewel/Heart -->
    <circle cx="256" cy="222" r="20" fill="#ffffff"/>
    <circle cx="256" cy="222" r="14" fill="#10b981"/>
    <!-- Crown / Rays at Top -->
    <circle cx="256" cy="138" r="8" fill="#fde047"/>
    <circle cx="230" cy="144" r="6" fill="#fde047"/>
    <circle cx="282" cy="144" r="6" fill="#fde047"/>
  </g>

  <!-- Musical Healing Soundwaves at Base -->
  <g fill="#34d399" opacity="0.95">
    <rect x="160" y="405" width="12" height="28" rx="6"/>
    <rect x="185" y="390" width="12" height="43" rx="6"/>
    <rect x="210" y="375" width="12" height="58" rx="6"/>
    <rect x="235" y="360" width="12" height="73" rx="6"/>
    <rect x="265" y="360" width="12" height="73" rx="6"/>
    <rect x="290" y="375" width="12" height="58" rx="6"/>
    <rect x="315" y="390" width="12" height="43" rx="6"/>
    <rect x="340" y="405" width="12" height="28" rx="6"/>
  </g>
</svg>
