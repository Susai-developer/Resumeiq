<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <radialGradient id="seaGlow" cx="50%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#021c1b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg7)"/>
  <circle cx="250" cy="180" r="160" fill="url(#seaGlow)"/>

  <!-- Holy Marian Ocean Waves & Star of the Sea (Stella Maris) -->
  <g filter="url(#shadow7)">
    <!-- Star of the Sea (Stella Maris) -->
    <path d="M 250 80 L 256 125 L 300 130 L 256 135 L 250 180 L 244 135 L 200 130 L 244 125 Z" fill="#ffffff"/>
    <circle cx="250" cy="130" r="9" fill="#2dd4bf"/>

    <!-- Subtle radiant stars -->
    <circle cx="160" cy="120" r="3" fill="#99f6e4" opacity="0.8"/>
    <circle cx="340" cy="120" r="3" fill="#99f6e4" opacity="0.8"/>
    <circle cx="190" cy="80" r="2.5" fill="#fef08a" opacity="0.7"/>
    <circle cx="310" cy="80" r="2.5" fill="#fef08a" opacity="0.7"/>

    <!-- Ocean Crest Waves (Alaikadal) -->
    <path d="M 50 250 Q 150 210 250 250 T 450 250 L 450 340 L 50 340 Z" fill="#115e59" opacity="0.6"/>
    <path d="M 30 265 Q 140 225 250 265 T 470 265 L 470 350 L 30 350 Z" fill="#0f766e" opacity="0.7"/>
    <path d="M 0 280 Q 125 240 250 280 T 500 280 L 500 370 L 0 370 Z" fill="#0d9488" opacity="0.85"/>
    
    <!-- Wave Foams -->
    <path d="M 0 280 Q 125 240 250 280 T 500 280" fill="none" stroke="#ccfbf1" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Velvet Footer -->
  <rect x="0" y="370" width="500" height="130" fill="#021c1b" opacity="0.96"/>
  <rect x="0" y="368" width="500" height="2" fill="#2dd4bf" opacity="0.6"/>

  <text x="30" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Kathum Alaikadal
  </text>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#99f6e4">
    கத்தும் அலைகடல் ஓரத்திலே
  </text>
  <text x="30" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#2dd4bf">
    Catholic Musing • Alaikadal Matha
  </text>

  <!-- Spotify style badge -->
  <circle cx="450" cy="435" r="22" fill="#1ed760"/>
  <polygon points="445,424 461,435 445,446" fill="#000000"/>
</svg>