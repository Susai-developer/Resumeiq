<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#260e02"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg5)"/>
  <circle cx="250" cy="190" r="170" fill="url(#amberGlow)"/>

  <!-- Velankanni Basilica Silhouette & Sacred Aureole -->
  <g filter="url(#shadow5)">
    <!-- Aureole -->
    <circle cx="250" cy="180" r="95" stroke="#fcd34d" stroke-width="2.5" fill="none"/>
    <circle cx="250" cy="180" r="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>

    <!-- Basilica spires and arches -->
    <path d="M 235 240 L 235 150 L 250 120 L 265 150 L 265 240 Z" fill="#fbbf24"/>
    <path d="M 205 240 L 205 170 L 220 145 L 235 170 L 235 240 Z" fill="#d97706"/>
    <path d="M 265 240 L 265 170 L 280 145 L 295 170 L 295 240 Z" fill="#d97706"/>
    
    <!-- Central Cross atop spire -->
    <line x1="250" y1="95" x2="250" y2="120" stroke="#ffffff" stroke-width="3"/>
    <line x1="242" y1="105" x2="258" y2="105" stroke="#ffffff" stroke-width="3"/>

    <!-- Maternal heart/protective arch -->
    <path d="M 180 250 C 180 200 320 200 320 250 Z" fill="#92400e" opacity="0.6"/>
  </g>

  <rect x="0" y="370" width="500" height="130" fill="#1c0b02" opacity="0.95"/>
  <rect x="0" y="368" width="500" height="2" fill="#f59e0b" opacity="0.6"/>

  <text x="30" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Arokiya Thaye Amma Amma
  </text>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#fde68a">
    ஆரோக்கிய தாயே அம்மா அம்மா
  </text>
  <text x="30" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#d97706">
    Christian Catholic • Thaayin Madiyil
  </text>

  <!-- Spotify style badge -->
  <circle cx="450" cy="435" r="22" fill="#1ed760"/>
  <polygon points="445,424 461,435 445,446" fill="#000000"/>
</svg>