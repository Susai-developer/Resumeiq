<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 320" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem (Height 260px) -->
  <g transform="translate(30, 30)">
    <!-- Outer Glow Circle -->
    <circle cx="130" cy="130" r="128" fill="#0b171f" stroke="url(#logoBgGrad)" stroke-width="8"/>
    
    <!-- Sound Waves / Divine Rays -->
    <g stroke="url(#logoBgGrad)" stroke-linecap="round" opacity="0.9">
      <path d="M 60 100 A 90 90 0 0 1 200 100" fill="none" stroke-width="8"/>
      <path d="M 80 120 A 65 65 0 0 1 180 120" fill="none" stroke-width="7"/>
    </g>

    <!-- Cross & Heart Center -->
    <g filter="url(#logoGlow)">
      <!-- Cross Beams -->
      <rect x="123" y="70" width="14" height="120" rx="7" fill="url(#logoGold)"/>
      <rect x="85" y="100" width="90" height="14" rx="7" fill="url(#logoGold)"/>
      <!-- Core Emerald Light -->
      <circle cx="130" cy="107" r="12" fill="#ffffff"/>
      <circle cx="130" cy="107" r="8" fill="#10b981"/>
      <!-- Top Crown Pearls -->
      <circle cx="130" cy="58" r="5" fill="#fde047"/>
      <circle cx="114" cy="62" r="4" fill="#fde047"/>
      <circle cx="146" cy="62" r="4" fill="#fde047"/>
    </g>

    <!-- Equalizer Sound Wave Bars -->
    <g fill="#34d399">
      <rect x="85" y="205" width="7" height="16" rx="3.5"/>
      <rect x="99" y="196" width="7" height="25" rx="3.5"/>
      <rect x="113" y="186" width="7" height="35" rx="3.5"/>
      <rect x="127" y="177" width="7" height="44" rx="3.5"/>
      <rect x="141" y="186" width="7" height="35" rx="3.5"/>
      <rect x="155" y="196" width="7" height="25" rx="3.5"/>
      <rect x="169" y="205" width="7" height="16" rx="3.5"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(330, 0)">
    <!-- Main Title -->
    <text x="0" y="175" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="125" font-weight="900" fill="#ffffff" letter-spacing="-2">
      AROKIYAM
    </text>
    <!-- Tagline -->
    <text x="5" y="228" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#10b981" letter-spacing="8">
      SACRED DEVOTIONAL MUSIC
    </text>
  </g>
</svg>
