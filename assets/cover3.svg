<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="skyGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg3)"/>
  <circle cx="250" cy="190" r="160" fill="url(#skyGlow)"/>

  <!-- Celestial Rosary & Radiance -->
  <g filter="url(#shadow3)">
    <circle cx="250" cy="180" r="85" stroke="#bae6fd" stroke-width="2" stroke-dasharray="8,6" fill="none"/>
    <circle cx="250" cy="180" r="110" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>

    <!-- Dove of Holy Spirit -->
    <path d="M 250 145 C 230 135 205 155 220 175 C 235 190 250 200 250 200 C 250 200 265 190 280 175 C 295 155 270 135 250 145 Z" fill="#ffffff"/>
    <circle cx="250" cy="155" r="8" fill="#38bdf8"/>
    <!-- Gentle rays -->
    <line x1="250" y1="95" x2="250" y2="125" stroke="#bae6fd" stroke-width="3"/>
    <line x1="210" y1="110" x2="225" y2="135" stroke="#bae6fd" stroke-width="2"/>
    <line x1="290" y1="110" x2="275" y2="135" stroke="#bae6fd" stroke-width="2"/>
    <line x1="180" y1="150" x2="210" y2="160" stroke="#bae6fd" stroke-width="2"/>
    <line x1="320" y1="150" x2="290" y2="160" stroke="#bae6fd" stroke-width="2"/>
    <!-- Cross hanging -->
    <path d="M 248 215 L 252 215 L 252 245 L 260 245 L 260 249 L 252 249 L 252 270 L 248 270 L 248 249 L 240 249 L 240 245 L 248 245 Z" fill="#fde047"/>
  </g>

  <rect x="0" y="370" width="500" height="130" fill="#041f30" opacity="0.95"/>
  <rect x="0" y="368" width="500" height="2" fill="#38bdf8" opacity="0.6"/>

  <text x="30" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Mangala Nilave (Acoustic Prayer)
  </text>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#7dd3fc">
    மங்கள நிலவே (அமைதி தியானம்)
  </text>
  <text x="30" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Midnight Prayer • Velankanni Ensemble
  </text>

  <!-- Spotify style badge -->
  <circle cx="450" cy="435" r="22" fill="#1ed760"/>
  <polygon points="445,424 461,435 445,446" fill="#000000"/>
</svg>