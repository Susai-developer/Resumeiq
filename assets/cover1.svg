<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b1d"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="500" height="500" fill="url(#bg)"/>
  <circle cx="250" cy="200" r="180" fill="url(#glow)"/>
  
  <!-- Subtle halo circles -->
  <circle cx="250" cy="190" r="110" stroke="#fef08a" stroke-width="2" stroke-opacity="0.3" fill="none"/>
  <circle cx="250" cy="190" r="130" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.4" fill="none"/>
  
  <!-- Rays -->
  <g stroke="#fef08a" stroke-width="1.5" stroke-opacity="0.25">
    <line x1="250" y1="50" x2="250" y2="90"/>
    <line x1="250" y1="290" x2="250" y2="330"/>
    <line x1="110" y1="190" x2="150" y2="190"/>
    <line x1="350" y1="190" x2="390" y2="190"/>
    <line x1="150" y1="90" x2="180" y2="120"/>
    <line x1="350" y1="290" x2="320" y2="260"/>
    <line x1="350" y1="90" x2="320" y2="120"/>
    <line x1="150" y1="290" x2="180" y2="260"/>
  </g>

  <!-- Cross Emblem & Marian Monogram -->
  <g filter="url(#shadow)">
    <!-- Holy cross -->
    <path d="M 245 110 L 255 110 L 255 170 L 285 170 L 285 180 L 255 180 L 255 270 L 245 270 L 245 180 L 215 180 L 215 170 L 245 170 Z" fill="#fef08a"/>
    <!-- Marian crown -->
    <path d="M 230 110 L 240 120 L 250 102 L 260 120 L 270 110 L 265 128 L 235 128 Z" fill="#fbbf24"/>
    <!-- Heart & Rays -->
    <path d="M 250 200 C 240 185 220 188 220 206 C 220 224 250 245 250 245 C 250 245 280 224 280 206 C 280 188 260 185 250 200 Z" fill="#10b981" opacity="0.9"/>
  </g>

  <!-- Bottom Details & Typography -->
  <rect x="0" y="370" width="500" height="130" fill="#021f18" opacity="0.95"/>
  <rect x="0" y="368" width="500" height="2" fill="#10b981" opacity="0.6"/>

  <text x="30" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Umai Thedi Vanthen
  </text>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#34d399">
    உம்மைத் தேடி வந்தேன் சுமை தீருமம்மா
  </text>
  <text x="30" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#9ca3af">
    Ave Maria Updates • Ulagazhum Thaaye
  </text>
  
  <!-- Spotify style badge -->
  <circle cx="450" cy="435" r="22" fill="#1ed760"/>
  <polygon points="445,424 461,435 445,446" fill="#000000"/>
</svg>