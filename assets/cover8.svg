<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="skyGlow" cx="50%" cy="36%" r="48%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg8)"/>
  <circle cx="250" cy="180" r="160" fill="url(#skyGlow)"/>

  <!-- Sacred Heart & Marian Rosary (Jebamaalai) & Lotus of Peace -->
  <g filter="url(#shadow8)">
    <!-- Rosary Beads in a Heart Shape -->
    <path d="M 250 140 C 210 90 140 120 160 170 C 180 220 250 260 250 260 C 250 260 320 220 340 170 C 360 120 290 90 250 140 Z" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="2,12" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Central Marian Cross dangling from Rosary -->
    <path d="M 247 265 L 253 265 L 253 295 L 262 295 L 262 300 L 253 300 L 253 315 L 247 315 L 247 300 L 238 300 L 238 295 L 247 295 Z" fill="#fbbf24"/>

    <!-- Radiant Dove / Flower of Grace in Center -->
    <circle cx="250" cy="165" r="28" fill="#3b82f6" opacity="0.6"/>
    <polygon points="250,140 258,158 277,165 258,172 250,190 242,172 223,165 242,158" fill="#ffffff"/>
    <circle cx="250" cy="165" r="6" fill="#fbbf24"/>
    
    <!-- Blooming Petals (Agame Arul Niraiyudhamma) -->
    <ellipse cx="215" cy="165" rx="14" ry="7" fill="#bfdbfe" opacity="0.7" transform="rotate(-30 215 165)"/>
    <ellipse cx="285" cy="165" rx="14" ry="7" fill="#bfdbfe" opacity="0.7" transform="rotate(30 285 165)"/>
  </g>

  <!-- Velvet Footer -->
  <rect x="0" y="370" width="500" height="130" fill="#080d1a" opacity="0.96"/>
  <rect x="0" y="368" width="500" height="2" fill="#60a5fa" opacity="0.6"/>

  <text x="30" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Manasellam Mella Mella
  </text>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe">
    மனசெல்லாம் மெல்ல மெல்ல
  </text>
  <text x="30" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#60a5fa">
    Fr. G.V. Panneer Selvam • Matha Padal
  </text>

  <!-- Spotify style badge -->
  <circle cx="450" cy="435" r="22" fill="#1ed760"/>
  <polygon points="445,424 461,435 445,446" fill="#000000"/>
</svg>