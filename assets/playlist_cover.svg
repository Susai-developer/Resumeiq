<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#pbg)"/>
  <circle cx="250" cy="180" r="180" fill="url(#centerGlow)"/>

  <!-- Halo rings -->
  <circle cx="250" cy="170" r="100" stroke="#fef08a" stroke-width="2" stroke-opacity="0.4" fill="none"/>
  <circle cx="250" cy="170" r="125" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="8,6" stroke-opacity="0.5" fill="none"/>

  <!-- Sacred Marian Crown & Cross -->
  <g filter="url(#pShadow)">
    <path d="M 215 150 L 230 170 L 250 135 L 270 170 L 285 150 L 280 185 L 220 185 Z" fill="#fbbf24"/>
    <!-- Cross on crown -->
    <path d="M 248 105 L 252 105 L 252 125 L 260 125 L 260 129 L 252 129 L 252 138 L 248 138 L 248 129 L 240 129 L 240 125 L 248 125 Z" fill="#ffffff"/>
    <!-- Velankanni Basilica Arch -->
    <path d="M 220 250 L 220 200 C 220 180 280 180 280 200 L 280 250 Z" fill="#14b8a6" opacity="0.6"/>
    <!-- Stars -->
    <polygon points="170,120 173,127 180,127 174,131 176,138 170,134 164,138 166,131 160,127 167,127" fill="#fde047"/>
    <polygon points="330,120 333,127 340,127 334,131 336,138 330,134 324,138 326,131 320,127 327,127" fill="#fde047"/>
  </g>

  <!-- Title & Branding -->
  <rect x="0" y="330" width="500" height="170" fill="#09141c" opacity="0.94"/>
  <rect x="0" y="328" width="500" height="2" fill="#2dd4bf" opacity="0.7"/>

  <text x="35" y="375" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf" letter-spacing="3">
    AROKIYAM SPECIAL
  </text>
  <text x="35" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="url(#goldText)" letter-spacing="0.5">
    VELANKANNI MATHA
  </text>
  <text x="35" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
    DEVOTIONAL SPECIAL HITS
  </text>
  <text x="35" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    வேளாங்கண்ணி ஆரோக்கிய மாதா பாடல் தொகுப்பு
  </text>

  <!-- Arokiyam official emblem badge -->
  <g transform="translate(435, 435)">
    <circle cx="0" cy="0" r="24" fill="#10b981"/>
    <polygon points="-5,-10 12,0 -5,10" fill="#ffffff"/>
  </g>
</svg>