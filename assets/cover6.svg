<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg6)"/>
  <circle cx="250" cy="190" r="170" fill="url(#lampGlow)"/>

  <!-- Holy Deepam / Temple Lamp & Halo Motif -->
  <g filter="url(#shadow6)">
    <!-- Marian Halo -->
    <circle cx="250" cy="180" r="110" stroke="#fde68a" stroke-width="1.8" stroke-dasharray="6,6" fill="none" opacity="0.6"/>
    
    <!-- Sacred Flame (Mani Deepam) -->
    <path d="M 250 85 C 265 125 285 155 270 185 C 260 205 240 205 230 185 C 215 155 235 125 250 85 Z" fill="#fef08a"/>
    <path d="M 250 115 C 260 145 270 165 260 185 C 255 195 245 195 240 185 C 230 165 240 145 250 115 Z" fill="#f59e0b"/>
    <circle cx="250" cy="182" r="8" fill="#ffffff" opacity="0.9"/>

    <!-- Brass Lamp Base (Vilakku) -->
    <path d="M 180 200 C 180 230 320 230 320 200 Z" fill="#f59e0b"/>
    <rect x="235" y="220" width="30" height="40" rx="3" fill="#d97706"/>
    <ellipse cx="250" cy="265" rx="75" ry="16" fill="#b45309"/>

    <!-- Cross atop the light -->
    <path d="M 248 55 L 252 55 L 252 75 L 260 75 L 260 78 L 252 78 L 252 85 L 248 85 L 248 78 L 240 78 L 240 75 L 248 75 Z" fill="#fde68a"/>
  </g>

  <!-- Velvet Footer -->
  <rect x="0" y="370" width="500" height="130" fill="#1b0833" opacity="0.96"/>
  <rect x="0" y="368" width="500" height="2" fill="#c084fc" opacity="0.6"/>

  <text x="30" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Matha Un Kovilil
  </text>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">
    மாதா உன் கோவிலில் மணிதீபம்
  </text>
  <text x="30" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#a855f7">
    Catholic Devotional • Velankanni Special
  </text>

  <!-- Spotify style badge -->
  <circle cx="450" cy="435" r="22" fill="#1ed760"/>
  <polygon points="445,424 461,435 445,446" fill="#000000"/>
</svg>