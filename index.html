<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AROKIYAM - Tamil Christian Music</title>
<meta name="description" content="AROKIYAM - Tamil Christian Music. Praise Him Always.">
<meta name="theme-color" content="#061235">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="paused">
<audio id="audio" preload="metadata"></audio>

<div class="app" id="app">
  <!-- ===== Sidebar (desktop) / drawer (mobile) ===== -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><img src="assets/logo.png" alt=""><b>AROKIYAM</b><span>Tamil Christian Music</span></div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="art"></div><div class="tag">Praise Him<br>Always</div>
      <button class="logout" id="logoutBtn"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ===== Main ===== -->
  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn m-only" id="menuBtn" aria-label="Open menu"></button>
      <div class="m-brand m-only"><img src="assets/arokiyam_mark.svg" alt=""><div><b>AROKIYAM</b><small>Tamil Christian Music</small></div></div>
      <button class="icon-btn m-only" id="bellBtn" aria-label="Notifications"></button>
      <label class="sbox" id="topSearch"><span id="topSearchIc"></span><input id="topInput" type="search" placeholder="Search songs, albums…" autocomplete="off" aria-label="Search"></label>
      <div class="top-spacer"></div>
      <button class="avatar" id="avatarBtn" aria-label="Account" title="Account"></button>
    </header>
    <div class="content" id="view"></div>
  </main>

  <!-- ===== Player bar / mini player ===== -->
  <section class="player" id="player" aria-label="Music player">
    <div class="m-prog"><i id="mProg"></i></div>
    <div class="p-left" id="pLeft">
      <img id="pCover" alt="">
      <div class="tx"><b id="pTitle">Choose a song</b><small id="pArtist">AROKIYAM</small></div>
      <button class="lk" id="pLike" aria-label="Like"></button>
    </div>
    <div class="p-mid">
      <div class="ctrls">
        <button class="cbtn off" id="bShuffle" aria-label="Shuffle"></button>
        <button class="cbtn white" id="bPrev" aria-label="Previous"></button>
        <button class="cbtn main" id="bPlay" aria-label="Play"></button>
        <button class="cbtn white" id="bNext" aria-label="Next"></button>
        <button class="cbtn off" id="bRepeat" aria-label="Repeat"></button>
      </div>
      <div class="seek"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="tDur">0:00</span></div>
    </div>
    <div class="p-right">
      <button class="cbtn" id="bLyrics" aria-label="Lyrics"></button>
      <button class="cbtn" id="bQueue" aria-label="Queue"></button>
      <button class="cbtn" id="bVol" aria-label="Mute"></button>
      <input type="range" class="vol" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
    <div class="m-ctrl">
      <button class="cbtn white" id="mPrev" aria-label="Previous"></button>
      <button class="cbtn main" id="mPlay" aria-label="Play"></button>
      <button class="cbtn white" id="mNext" aria-label="Next"></button>
    </div>
  </section>

  <nav class="bottomnav" id="bottomNav" aria-label="Bottom navigation"></nav>
</div>

<!-- ===== Now playing: full screen (mobile) / drawer (desktop) ===== -->
<section class="np" id="np" aria-label="Now playing" aria-hidden="true">
  <div class="np-top">
    <button class="icon-btn" id="npClose" aria-label="Close"></button>
    <div class="ttl">Now Playing</div>
    <button class="icon-btn" id="npMore" aria-label="More"></button>
  </div>
  <div class="np-tabs" id="npTabs">
    <button data-tab="player" class="t-player on">Player</button>
    <button data-tab="lyrics">Lyrics</button>
    <button data-tab="queue">Queue</button>
  </div>
  <div class="np-body">
    <div class="tab tab-player on" data-tab="player">
      <img class="np-art" id="npArt" alt="">
      <div class="np-meta">
        <div class="tx"><b id="npTitle"></b><small id="npArtist"></small></div>
        <button class="lk" id="npLike" aria-label="Like"></button>
      </div>
      <div class="seek np-seek"><span id="npCur">0:00</span><input type="range" id="npSeek" min="0" max="1000" value="0" aria-label="Seek"><span id="npDur">0:00</span></div>
      <div class="np-ctrls">
        <button class="cbtn off" id="npShuffle" aria-label="Shuffle"></button>
        <button class="cbtn white" id="npPrev" aria-label="Previous"></button>
        <button class="cbtn main" id="npPlay" aria-label="Play"></button>
        <button class="cbtn white" id="npNext" aria-label="Next"></button>
        <button class="cbtn off" id="npRepeat" aria-label="Repeat"></button>
      </div>
    </div>
    <div class="tab" data-tab="lyrics"><div class="lyrics" id="lyrics"></div></div>
    <div class="tab" data-tab="queue" id="queueTab"></div>
  </div>
</section>

<div class="menu-scrim" id="menuScrim"></div>
<div class="menu" id="menu" role="menu"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/auth.js"></script>
<script>window.ArokiyamAuth.requireAuth();</script>
<script src="js/data/songs.js"></script>
<script src="js/data/playlists.js"></script>
<script src="js/store.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
