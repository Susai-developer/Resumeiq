<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz - ResumeIQ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-page="quiz"><div id="nav"></div>
<div class="page-head"><div class="container"><h2>Resume quiz</h2><p class="text-muted mb-0">Questions based on your resume. Pick one answer for each.</p></div></div>
<div class="container py-5" style="max-width:760px">
 <div class="quiz-card">
  <div class="d-flex justify-content-between fw-bold mb-2"><span id="count"></span><span class="text-muted">Easy, Medium, Hard</span></div>
  <div class="progress mb-4"><div class="progress-bar" id="bar"></div></div>
  <div id="body"></div>
  <div class="d-flex justify-content-between mt-4">
   <button class="btn btn-soft" id="prev">Previous</button>
   <button class="btn btn-brand" id="next">Next</button>
   <button class="btn btn-brand d-none" id="submit">Submit quiz</button></div>
  <div class="d-flex flex-wrap gap-2 justify-content-center mt-4" id="dots"></div>
 </div>
</div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body></html>
