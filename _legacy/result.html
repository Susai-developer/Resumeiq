<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results - ResumeIQ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-page="result"><div id="nav"></div>
<div class="page-head"><div class="container"><h2>Quiz result</h2><p class="text-muted mb-0" id="verdict">Take the quiz to see your result.</p></div></div>
<div class="container py-5" style="max-width:860px">
 <div id="empty" class="card-x text-center d-none"><h5>No quiz taken yet</h5><p class="text-muted">Finish the quiz to see your result here.</p><a href="quiz.html" class="btn btn-brand">Go to quiz</a></div>
 <div id="content" class="d-none">
  <div class="row g-3 mb-4">
   <div class="col-6 col-md-3"><div class="card-x stat"><b id="total"></b>Total marks</div></div>
   <div class="col-6 col-md-3"><div class="card-x stat"><b class="text-success" id="ok"></b>Correct</div></div>
   <div class="col-6 col-md-3"><div class="card-x stat"><b class="text-danger" id="wrong"></b>Incorrect</div></div>
   <div class="col-6 col-md-3"><div class="card-x stat"><b class="text-primary" id="pct"></b>Percentage</div></div></div>
  <h4 class="mb-3">Answers and explanations</h4><div id="review"></div>
  <div class="text-center mt-4"><button class="btn btn-brand me-2" id="retry">Retake quiz</button><a href="dashboard.html" class="btn btn-soft">Upload another resume</a></div>
 </div>
</div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body></html>
