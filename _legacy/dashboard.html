<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - ResumeIQ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-page="dashboard"><div id="nav"></div>
<div class="page-head"><div class="container"><h2>Resume dashboard</h2><p class="text-muted mb-0">Upload your resume to get your analysis and quiz.</p></div></div>
<div class="container py-5">
 <div class="card-x p-4"><div class="drop" id="drop"><div class="big"><i class="bi bi-cloud-arrow-up"></i></div><h5>Click or drag your resume here</h5><p class="text-muted mb-0">PDF, JPG, JPEG or PNG, up to 5 MB</p></div>
  <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png" hidden>
  <div class="text-danger mt-2 fw-bold" id="err"></div>
  <div class="file-chip" id="chip"><i class="bi bi-file-earmark-text fs-3 text-primary"></i><div class="me-auto"><div class="fw-bold" id="fname"></div><small class="text-muted" id="fsize"></small></div><button class="btn btn-sm btn-soft" id="remove">Remove</button></div>
  <button class="btn btn-brand mt-4" id="analyzeBtn" disabled>Analyze resume</button></div>

 <div id="results" class="mt-5">
  <div class="row g-4">
   <div class="col-lg-4"><div class="card-x text-center"><div class="ring mx-auto" id="ring"><div><span><b>0</b><small>/100</small></span></div></div>
     <h5 class="mt-3 mb-0" id="pName"></h5><p class="text-muted" id="pJob"></p><div class="text-start mt-3" id="bars"></div></div></div>
   <div class="col-lg-8"><div class="row g-4">
     <div class="col-md-6"><div class="card-x"><h5>Education</h5><div id="edu"></div></div></div>
     <div class="col-md-6"><div class="card-x"><h5>Skills</h5><div id="skills"></div></div></div>
     <div class="col-12"><div class="card-x"><h5>Experience and projects</h5><div id="exp"></div></div></div>
     <div class="col-12"><div class="card-x"><h5>Certifications</h5><div id="certs"></div></div></div></div></div>
   <div class="col-md-4"><div class="card-x"><h5>Strengths</h5><div id="str"></div></div></div>
   <div class="col-md-4"><div class="card-x"><h5>Weaknesses</h5><div id="weak"></div></div></div>
   <div class="col-md-4"><div class="card-x"><h5>Improvement suggestions</h5><div id="tips"></div></div></div>
  </div>
  <div class="text-center mt-5"><a href="quiz.html" class="btn btn-brand btn-lg">Start the 10-question quiz</a></div>
 </div>
</div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body></html>
